# KAN-62 rung 3: OIDC → build linux/arm64 → push ECR. Does not start Fargate.
# GitLab analogue: a manual build job that publishes to the registry, no deploy stage.
# Fargate is ARM64; GitHub-hosted runners are amd64 — QEMU + buildx is required.
name: ecr-push

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ecr-push.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cloudsec-lab
  ECS_CLUSTER: cloudsec-lab
  ECS_SERVICE: cloudsec-lab

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU (arm64 on an amd64 runner)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::951694610756:role/cloudsec-lab-github
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:gha
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Prove architecture and that Fargate is still off
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "=== runner CPU (should be x86_64) ==="
          uname -m
          echo "=== image we just pushed (should be linux/arm64) ==="
          docker buildx imagetools inspect "$ECR_REGISTRY/$ECR_REPOSITORY:gha"
          echo "=== ECS (desired should still be 0) ==="
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{desired:desiredCount,running:runningCount,status:status}' \
            --output table
