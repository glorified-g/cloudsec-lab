# KAN-63: golden CI image → GHCR. linux/amd64 CLIs for Actions. Not the Fargate app image.
# Other workflows keep pulling Docker Hub until this image exists, then we point them at it.
name: ci-image

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"
  push:
    branches: [main]
    paths:
      - "ci/**"
      - ".github/workflows/ci-image.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/glorified-g/cloudsec-lab-ci

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Image version
        id: ver
        run: echo "tag=$(tr -d '[:space:]' < ci/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./ci
          file: ./ci/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/glorified-g/cloudsec-lab
            org.opencontainers.image.title=cloudsec-lab-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke CLIs
        run: |
          img="${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}"
          docker pull "$img"
          docker run --rm "$img" terraform version
          docker run --rm "$img" trivy --version
          docker run --rm "$img" gitleaks version
          docker run --rm "$img" prowler -v
