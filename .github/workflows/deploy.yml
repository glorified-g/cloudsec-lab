# KAN-62: test → linux/arm64 image → ECR → force new ECS deployment.
# Does not terraform apply. Does not change desired_count (start/stop stays on the Mac).
# Mutable tag :gha — Terraform already points the task def at it; CI does not register a new revision.
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cloudsec-lab
  ECS_CLUSTER: cloudsec-lab
  ECS_SERVICE: cloudsec-lab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install and test
        run: |
          pip install -r app/requirements.txt pytest
          pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU (arm64 on an amd64 runner)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::951694610756:role/cloudsec-lab-github
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:gha
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # Buildx pushed linux/arm64 only (no load). Runner is amd64, so a bare
      # `trivy image $ECR:gha` looks for linux/amd64 and exits 1.
      - name: Trivy image
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:gha
        run: |
          docker pull --platform linux/arm64 "$IMAGE"
          echo "=== OS packages (report only; python:3.12-slim noise) ==="
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 \
            image --platform linux/arm64 "$IMAGE" \
            --severity HIGH,CRITICAL --pkg-types os --exit-code 0
          echo "=== App libraries (fails on HIGH/CRITICAL) ==="
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 \
            image --platform linux/arm64 "$IMAGE" \
            --severity HIGH,CRITICAL --pkg-types library --exit-code 1

      - name: Force new deployment of :gha
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --query 'service.{desired:desiredCount,running:runningCount,taskDefinition:taskDefinition}' \
            --output table
          DESIRED=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].desiredCount' \
            --output text)
          if [ "$DESIRED" = "0" ]; then
            echo "desired_count is 0. Image :gha is updated. Scale up from the Mac to run it."
          else
            aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
            echo "Service stable. Public IP changed — run scripts/ecs-url.sh on the Mac."
          fi
