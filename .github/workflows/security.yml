# KAN-54: Gitleaks + Trivy filesystem. Image scan lives on deploy.yml; IaC on infra.yml.
# CLIs come from ghcr.io/glorified-g/cloudsec-lab-ci:1.0.0 (KAN-63). No docker-in-docker.
name: security

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/security.yml"
      - ".trivyignore"
  pull_request:
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/security.yml"
      - ".trivyignore"

permissions:
  contents: read
  packages: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/glorified-g/cloudsec-lab-ci:1.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: gitleaks detect --source . -v

  trivy-fs:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/glorified-g/cloudsec-lab-ci:1.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Trivy filesystem
        run: |
          trivy fs . \
            --severity HIGH,CRITICAL \
            --skip-dirs app/.venv \
            --exit-code 1
