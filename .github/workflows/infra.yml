# KAN-53: infra pipeline. fmt + validate + Trivy IaC. No AWS apply.
# GitLab analogue: a terraform job with rules: changes: terraform/**
name: infra

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yml"
      - ".trivyignore"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yml"
      - ".trivyignore"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - name: Trivy IaC
        working-directory: .
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.74.0 config /src/terraform \
            --severity HIGH,CRITICAL \
            --exit-code 1
