# KAN-53: infra pipeline. fmt + validate + Trivy IaC. No AWS apply.
# CLIs come from ghcr.io/glorified-g/cloudsec-lab-ci:1.0.0 (KAN-63). No docker-in-docker.
name: infra

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yml"
      - ".trivyignore"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yml"
      - ".trivyignore"

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/glorified-g/cloudsec-lab-ci:1.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - name: Trivy IaC
        working-directory: ${{ github.workspace }}
        run: |
          trivy config terraform \
            --severity HIGH,CRITICAL \
            --exit-code 1
