# KAN-53: infra pipeline. fmt + validate only. No AWS, no apply, no Trivy.
# GitLab analogue: a terraform job with rules: changes: terraform/**
name: infra

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate
