# KAN-56: Prowler CIS against live AWS. Report only — a lab account will fail many checks.
# Manual (workflow_dispatch). Does not run on git push. Does not terraform apply.
# Prowler CLI from ghcr.io/glorified-g/cloudsec-lab-ci:1.0.0 (KAN-63).
name: prowler

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: read

env:
  AWS_REGION: us-east-1

jobs:
  cis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/glorified-g/cloudsec-lab-ci:1.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC prowler role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::951694610756:role/cloudsec-lab-github-prowler
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Prowler CIS 2.0 (us-east-1)
        run: |
          mkdir -p prowler-output
          prowler aws --region us-east-1 --compliance cis_2.0_aws \
            --output-formats csv json-ocsf html --ignore-exit-code-3 \
            --output-directory prowler-output

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: prowler-cis
          path: prowler-output
